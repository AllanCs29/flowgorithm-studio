
name: Publicar Flowgorithm Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --include=dev

      - name: Compilar Flowgorithm Studio
        run: npm run build
        env:
          BASE_PATH: /flowgorithm-studio/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicación compilada
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar aplicación
        id: deployment
        uses: actions/deploy-pages@v4
